name: Build and Release Gomel EV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Ensure debug keystore exists for release signing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests and build release APK
        run: gradle testDebugUnitTest assembleRelease --no-daemon --console=plain

      - name: Prepare release artifact
        run: |
          cp app/build/outputs/apk/release/app-release.apk GomelEV-v2.0.0.apk
          ls -lh GomelEV-v2.0.0.apk

      - name: Publish GitHub Release v2.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: Gomel EV v2.0.0 (Material 3 Expressive)
          generate_release_notes: false
          body: |
            Релиз нативного Android-приложения **Gomel EV v2.0.0** по гайдлайнам Google Material 3 Expressive для Galaxy Z Fold и обычных смартфонов:

            - Адаптивная навигация: на узком внешнем экране панель **снизу**, в развёрнутом режиме Fold меню слева **посередине экрана** (`NavigationRail`).
            - Адаптивная разметка `FlowRow` — номера телефонов дилеров, фильтры и кнопки больше не обрезаются.
            - **15 уникальных иллюстраций автомобилей** с factory-окраской, тенями и детализацией кузова (включая `Geely EX2 Max`, `BYD Yuan UP`, `JAC E30X` б/у).
            - Полноценная **тёмная и светлая темы** (`Авто / Светлая / Тёмная`), весенняя физика анимаций (`ExpressiveMotion`) и студийные градиенты.
            - Новая адаптивная иконка Material 3 (включая `monochrome` для тематических иконок).
            - Убрана техническая карточка GitHub/OTA из интерфейса.

            Скачайте `GomelEV-v2.0.0.apk` ниже и подтвердите установку на смартфоне.
          files: |
            GomelEV-v2.0.0.apk
