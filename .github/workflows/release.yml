name: Build and Release Gomel EV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Ensure debug keystore exists for release signing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests and build release APK
        run: gradle testDebugUnitTest assembleRelease --no-daemon --console=plain

      - name: Prepare release artifact
        run: |
          cp app/build/outputs/apk/release/app-release.apk GomelEV-v1.0.0.apk
          ls -lh GomelEV-v1.0.0.apk

      - name: Publish GitHub Release v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Gomel EV v1.0.0
          generate_release_notes: false
          body: |
            Релиз нативного Android-приложения **Gomel EV v1.0.0** (APK с поддержкой Galaxy Z Fold / Material 3 Adaptive).

            Скачайте файл `GomelEV-v1.0.0.apk` ниже и подтвердите установку из браузера на смартфоне.
          files: |
            GomelEV-v1.0.0.apk